<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440"><rect width="800" height="440" rx="32" fill="#eee8fa"/><text x="45" y="55" fill="#4e3b72" font-family="sans-serif" font-size="18" font-weight="bold">UMA EQUAÇÃO · DOIS CASOS</text><text x="400" y="127" text-anchor="middle" fill="#254a3b" font-family="sans-serif" font-size="42">2x² − 5x = 0</text><text x="400" y="204" text-anchor="middle" fill="#254a3b" font-family="sans-serif" font-size="39">x(2x − 5) = 0</text><path d="M400 225 L400 247 L210 247 L210 273 M400 247 L590 247 L590 273" stroke="#77648f" stroke-width="3" fill="none"/><rect x="75" y="277" width="270" height="86" rx="18" fill="#254a3b"/><rect x="455" y="277" width="270" height="86" rx="18" fill="#254a3b"/><text x="210" y="332" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="35">x = 0</text><text x="590" y="332" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="35">2x − 5 = 0</text><text x="400" y="329" text-anchor="middle" fill="#4e3b72" font-family="sans-serif" font-size="22">ou</text><text x="400" y="408" text-anchor="middle" fill="#435849" font-family="sans-serif" font-size="20">Um produto nulo. Pelo menos um fator nulo.</text></svg>
